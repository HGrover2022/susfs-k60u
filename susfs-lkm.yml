name: SUSFS LKM Build (android13-5.15 / KMI 8)

# 一键编译带 SUSFS 的 kernelsu.ko + 内核镜像 Image
# 适用设备：Redmi 23078RKD5C (corot) / 内核 5.15.78-android13-8 (KMI 8)
# 基于 pershoot gki-kernel.yml 改造：
#   - 内核源码锁定 KMI 8 tag: android13-5.15-2023-06 (deprecated 自动处理)
#   - KernelSU-Next 使用 pershoot next-susfs 分支（自带 SUSFS 模块侧集成）
#   - 追加 SUSFS 内核补丁(50_add_susfs) + 3 个源文件 + KMI 8 修复脚本

on:
  workflow_dispatch:

jobs:
  build:
    name: Build kernelsu + SUSFS (android13-5.15-2023-06)
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Checkout KernelSU-Next (next-susfs)
        uses: actions/checkout@v5
        with:
          repository: pershoot/KernelSU-Next
          ref: next-susfs
          path: KernelSU-Next
          fetch-depth: 0

      - name: Setup Kernel Source (KMI 8 tag)
        run: |
          echo "Free space:"
          df -h
          cd $GITHUB_WORKSPACE
          sudo apt-get install repo -y
          mkdir android-kernel && cd android-kernel
          repo init --depth=1 --u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-2023-06 --repo-rev=v2.16
          REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common android13-5.15-2023-06)
          DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml
          if grep -q deprecated <<< $REMOTE_BRANCH; then
            echo "Found deprecated branch: android13-5.15-2023-06"
            sed -i 's/"android13-5.15-2023-06"/"deprecated\/android13-5.15-2023-06"/g' $DEFAULT_MANIFEST_PATH
            cat $DEFAULT_MANIFEST_PATH
          fi
          repo --version
          repo --trace sync -c -j$(nproc --all) --no-tags
          df -h

      - name: Setup KernelSU-Next
        run: |
          cd $GITHUB_WORKSPACE/android-kernel
          echo "[+] KernelSU-Next setup"
          GKI_ROOT=$(pwd)
          echo "[+] GKI_ROOT: $GKI_ROOT"
          echo "[+] Copy KernelSU-Next driver to $GKI_ROOT/common/drivers"
          ln -sf $GITHUB_WORKSPACE/KernelSU-Next/kernel $GKI_ROOT/common/drivers/kernelsu
          echo "[+] Add KernelSU-Next driver to Makefile"
          DRIVER_MAKEFILE=$GKI_ROOT/common/drivers/Makefile
          DRIVER_KCONFIG=$GKI_ROOT/common/drivers/Kconfig
          grep -q "kernelsu" "$DRIVER_MAKEFILE" || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> "$DRIVER_MAKEFILE"
          grep -q "kernelsu" "$DRIVER_KCONFIG" || sed -i "/endmenu/i\\source \"drivers/kernelsu/Kconfig\"" "$DRIVER_KCONFIG"
          echo "[+] Apply Compilation Patches"
          if [ ! -e build/build.sh ]; then
            GLIBC_VERSION=$(ldd --version 2>/dev/null | head -n 1 | awk '{print $NF}')
            echo "GLIBC_VERSION: $GLIBC_VERSION"
            if [ "$(printf '%s\n' "2.38" "$GLIBC_VERSION" | sort -V | head -n1)" = "2.38" ]; then
              echo "Patching resolve_btfids/Makefile"
              cd $GKI_ROOT/common/ && sed -i '/\$(Q)\$(MAKE) -C \$(SUBCMD_SRC) OUTPUT=\$(abspath \$(dir \$@))\/ \$(abspath \$@)/s//$(Q)$(MAKE) -C $(SUBCMD_SRC) EXTRA_CFLAGS="$(CFLAGS)" OUTPUT=$(abspath $(dir $@))\/ $(abspath $@)/' tools/bpf/resolve_btfids/Makefile || echo "No patch needed."
            fi
          fi
          repo status
          echo "[+] KernelSU-Next setup done."

      - name: Symbol Magic
        run: |
          echo "[+] Export all symbol from abi_gki_aarch64.xml"
          COMMON_ROOT=$GITHUB_WORKSPACE/android-kernel/common
          KSU_ROOT=$GITHUB_WORKSPACE/KernelSU-Next
          ABI_XML=$COMMON_ROOT/android/abi_gki_aarch64.xml
          SYMBOL_LIST=$COMMON_ROOT/android/abi_gki_aarch64
          echo "[+] Add KernelSU-Next symbols"
          cat $KSU_ROOT/kernel/export_symbol.txt | awk '{sub("[ \t]+","");print "  "$0}' >> $SYMBOL_LIST

      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: gki-kernel-aarch64-android13-5.15-susfs
          max-size: 2G
          save: true

      - name: Setup for LKM
        working-directory: android-kernel
        run: |
          pip install ast-grep-cli
          sudo apt-get install llvm-15 -y
          ast-grep -U -p '$$$ check_exports($$$) {$$$}' -r '' common/scripts/mod/modpost.c
          ast-grep -U -p 'check_exports($$$);' -r '' common/scripts/mod/modpost.c
          sed -i '/config KSU/,/help/{s/default y/default m/}' common/drivers/kernelsu/Kconfig
          echo "drivers/kernelsu/kernelsu.ko" >> common/android/gki_aarch64_modules

          # bazel build, android14-5.15, android14-6.1 use bazel
          if [ ! -e build/build.sh ]; then
            sed -i 's/needs unknown symbol/Dont abort when unknown symbol/g' build/kernel/*.sh || echo "No unknown symbol scripts found"
            if [ -e common/modules.bzl ]; then
              sed -i 's/_COMMON_GKI_MODULES_LIST = \[/_COMMON_GKI_MODULES_LIST = \[ "drivers\/kernelsu\/kernelsu.ko",/g' common/modules.bzl
            fi
          else
            TARGET_FILE="build/kernel/build.sh"
            if [ ! -e "$TARGET_FILE" ]; then
              TARGET_FILE="build/build.sh"
            fi
            sed -i 's/needs unknown symbol/Dont abort when unknown symbol/g' $TARGET_FILE || echo "No unknown symbol in $TARGET_FILE"
            sed -i 's/if ! diff -u "\${KERNEL_DIR}\/\${MODULES_ORDER}" "\${OUT_DIR}\/modules\.order"; then/if false; then/g' $TARGET_FILE
            sed -i 's@${ROOT_DIR}/build/abi/compare_to_symbol_list@echo@g' $TARGET_FILE
            sed -i 's/needs unknown symbol/Dont abort when unknown symbol/g' build/kernel/*.sh || echo "No unknown symbol scripts found"
          fi

      - name: Integrate SUSFS into Kernel Source
        working-directory: android-kernel/common
        run: |
          set -e
          echo "[+] Downloading SUSFS kernel patch"
          curl -L -o /tmp/50_add_susfs.patch https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android13-5.15/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch
          echo "[+] Applying 50_add_susfs patch (3 hunks rejected on KMI 8, fixed below)"
          git apply --reject /tmp/50_add_susfs.patch || echo "Partial reject expected, continuing..."
          echo "[+] Rejected hunks:"
          find . -name '*.rej' || true
          echo "[+] Downloading SUSFS source files"
          curl -L -o fs/susfs.c https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android13-5.15/kernel_patches/fs/susfs.c
          curl -L -o include/linux/susfs.h https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android13-5.15/kernel_patches/include/linux/susfs.h
          curl -L -o include/linux/susfs_def.h https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android13-5.15/kernel_patches/include/linux/susfs_def.h
          echo "[+] Applying KMI 8 manual fixes"
          cat > /tmp/fix_susfs_kmi8.py <<'PYEOF'
#!/usr/bin/env python3
# -*- coding: utf-8 -*-
"""
fix_susfs_kmi8.py
修复 SUSFS 50_add_susfs patch 在 KMI 8 (android13-5.15-2023-06, 5.15.78) 上
无法干净应用(被 git apply --reject 拒绝)的 3 个 hunk。

差异根因：5.15.189 (SUSFS 目标) 相比 5.15.78 引入了以下代码：
  1. kernel/sys.c  __sys_setresuid 中的 "bool ruid_new, euid_new, suid_new;"
  2. fs/proc/task_mmu.c  show_smap 中的 "if (!vma_pages(vma))"
  3. fs/namei.c  新函数 lookup_one_qstr_excl (5.15.78 对应函数为 __lookup_hash)

用法：在 common/ 内核源码根目录执行: python3 fix_susfs_kmi8.py
前置条件：50_add_susfs patch 已通过 `git apply --reject` 应用，
         且所有 *.rej 文件尚未删除。
"""

import io
import sys

def patch_file(path, old, new, tag):
    with io.open(path, encoding='utf-8') as f:
        s = f.read()
    n = s.count(old)
    if n != 1:
        sys.stderr.write("[FAIL] %s: anchor found %d times (expected 1)\n" % (tag, n))
        sys.exit(1)
    s = s.replace(old, new)
    with io.open(path, 'w', encoding='utf-8', newline='\n') as f:
        f.write(s)
    sys.stdout.write("[OK] %s\n" % tag)

# ------------------------------------------------------------------
# 1) kernel/sys.c : __sys_setresuid 插入 ksu_handle_setresuid 调用
#    原 hunk 上下文含 "bool ruid_new, euid_new, suid_new;" (5.15.78 没有)
# ------------------------------------------------------------------
patch_file(
    'kernel/sys.c',
    "\tkuid_t kruid, keuid, ksuid;\n\n\tkruid = make_kuid(ns, ruid);",
    "\tkuid_t kruid, keuid, ksuid;\n\n"
    "#ifdef CONFIG_KSU_SUSFS\n"
    "\t(void)ksu_handle_setresuid(ruid, euid, suid);\n"
    "#endif\n\n"
    "\tkruid = make_kuid(ns, ruid);",
    'kernel/sys.c  (ksu_handle_setresuid)')

# ------------------------------------------------------------------
# 2) fs/proc/task_mmu.c : show_smap 开头插入 SUS_MAP 隐藏检查
#    原 hunk 上下文含 "if (!vma_pages(vma))" (5.15.78 没有)
# ------------------------------------------------------------------
patch_file(
    'fs/proc/task_mmu.c',
    "static int show_smap(struct seq_file *m, void *v)\n"
    "{\n"
    "\tstruct vm_area_struct *vma = v;\n"
    "\tstruct mem_size_stats mss;\n\n"
    "\tmemset(&mss, 0, sizeof(mss));",
    "static int show_smap(struct seq_file *m, void *v)\n"
    "{\n"
    "\tstruct vm_area_struct *vma = v;\n"
    "\tstruct mem_size_stats mss;\n\n"
    "#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n"
    "\tif (vma->vm_file) {\n"
    "\t\tif (SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))\n"
    "\t\t\treturn 0;\n"
    "\t}\n"
    "#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MAP\n\n"
    "\tmemset(&mss, 0, sizeof(mss));",
    'fs/proc/task_mmu.c (show_smap SUS_MAP)')

# ------------------------------------------------------------------
# 3) fs/namei.c : __lookup_hash 尾部插入 SUS_PATH 检查
#    (5.15.78 中 lookup_one_qstr_excl 不存在, 对应函数为 __lookup_hash;
#      前 4 个 hunk 已自动落到 __lookup_hash, 此处补尾块)
# ------------------------------------------------------------------
patch_file(
    'fs/namei.c',
    "\tdentry = d_alloc(base, name);\n"
    "#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
    "retry:\n"
    "#endif\n"
    "\tif (unlikely(!dentry))\n"
    "\t\treturn ERR_PTR(-ENOMEM);\n\n"
    "\told = dir->i_op->lookup(dir, dentry, flags);\n"
    "\tif (unlikely(old)) {\n"
    "\t\tdput(dentry);\n"
    "\t\tdentry = old;\n"
    "\t}\n"
    "\treturn dentry;\n"
    "}",
    "\tdentry = d_alloc(base, name);\n"
    "#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
    "retry:\n"
    "#endif\n"
    "\tif (unlikely(!dentry))\n"
    "\t\treturn ERR_PTR(-ENOMEM);\n\n"
    "\told = dir->i_op->lookup(dir, dentry, flags);\n"
    "\tif (unlikely(old)) {\n"
    "\t\tdput(dentry);\n"
    "\t\tdentry = old;\n"
    "\t}\n"
    "#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
    "\tif (unlikely(dentry) && !IS_ERR(dentry) && dentry->d_inode && !found_sus_path && susfs_is_inode_sus_path(dentry->d_inode)) {\n"
    "\t\tif (d_in_lookup(dentry))\n"
    "\t\t\td_lookup_done(dentry);\n"
    "\t\tif (!(flags & LOOKUP_RCU))\n"
    "\t\t\tdput(dentry);\n"
    "\t\tdentry = d_alloc(base, &susfs_fake_qstr_name);\n"
    "\t\tfound_sus_path = true;\n"
    "\t\tgoto retry;\n"
    "\t}\n"
    "#endif\n"
    "\treturn dentry;\n"
    "}",
    'fs/namei.c (__lookup_hash SUS_PATH)')

sys.stdout.write("All fixes applied.\n")
PYEOF
          python3 /tmp/fix_susfs_kmi8.py
          echo "[+] Removing .rej leftovers"
          find . -name '*.rej' -delete
          echo "[+] Verifying SUSFS integration"
          test -f fs/susfs.c && test -f include/linux/susfs.h && test -f include/linux/susfs_def.h
          grep -n "susfs.o" fs/Makefile
          echo "[+] SUSFS integration done."

      - name: Make Working Directory Clean to Avoid Dirty
        working-directory: android-kernel
        run: |
          if [ -f ./common/BUILD.bazel ]; then
            sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' ./common/BUILD.bazel
          fi
          rm common/android/abi_gki_protected_exports_* || echo "No protected exports!"
          git config --global user.email "bot@kernelsu.org"
          git config --global user.name "KernelSU-NextBot"
          cd common/ && git add -A && git commit -a -m "Add KernelSU-Next + SUSFS" || echo "Nothing to commit"
          repo status

      - name: Build Kernel/LKM
        working-directory: android-kernel
        run: |
          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh CC="/usr/bin/ccache clang"

      - name: Prepare Artifacts
        run: |
          OUTDIR=android-kernel/out/android13-5.15/dist
          if [ ! -e $OUTDIR ]; then
            OUTDIR=android-kernel/dist
          fi
          mkdir -p output
          echo "[+] Build outputs:"
          ls -lh $OUTDIR | head -n 40
          llvm-strip-15 -d $OUTDIR/kernelsu.ko
          cp $OUTDIR/kernelsu.ko ./output/kernelsu-android13-5.15.ko
          cp $OUTDIR/Image ./output/Image-susfs-android13-5.15
          echo "[+] Final artifacts:"
          ls -lh ./output/

      - name: Upload SUSFS LKM (kernelsu.ko)
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-android13-5.15-susfs-lkm
          path: ./output/kernelsu-android13-5.15.ko

      - name: Upload SUSFS Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Image-android13-5.15-susfs
          path: ./output/Image-susfs-android13-5.15
