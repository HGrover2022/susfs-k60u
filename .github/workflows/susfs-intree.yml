name: SUSFS Intree Build (android13-5.15 / KMI 8)

# 一键编译带 SUSFS + KernelSU(intree) 的内核镜像 Image
# KernelSU 直接编进内核(vmlinux)，不依赖外部 kernelsu.ko 加载
# 适用设备：Redmi 23078RKD5C (corot) / 内核 5.15-android13-8 (KMI 8)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build kernelsu + SUSFS (android13-5.15-2023-06)
    # Ubuntu 24.04 (glibc 2.38+) redirects strtol/strtoul/strtoull to __isoc23_*,
    # breaking resolve_btfids link with Android 13 clang-14. Pin to 22.04 (glibc 2.35).
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Checkout KernelSU-Next (next-susfs)
        uses: actions/checkout@v4
        with:
          repository: pershoot/KernelSU-Next
          ref: next-susfs
          path: KernelSU-Next
          fetch-depth: 0

      - name: Point origin/HEAD at next-susfs (fix KERNEL_SU_VERSION)
        run: |
          # KernelSU-Next/kernel/Makefile computes KERNEL_SU_VERSION from git describe.
          # With a detached checkout origin/HEAD is missing, so the tags/hash fallback
          # prints "fatal: ambiguous argument 'origin/HEAD'" and leaves KERNEL_SU_VERSION
          # empty -> core_hook.c "use of undeclared identifier 'KERNEL_SU_VERSION'".
          git -C $GITHUB_WORKSPACE/KernelSU-Next checkout next-susfs
          git -C $GITHUB_WORKSPACE/KernelSU-Next remote set-head origin next-susfs
          git -C $GITHUB_WORKSPACE/KernelSU-Next describe --tags --abbrev=0 || true
          git -C $GITHUB_WORKSPACE/KernelSU-Next log --oneline -1

      - name: Setup Kernel Source (KMI 8 tag)
        run: |
          echo "Free space:"
          df -h
          cd $GITHUB_WORKSPACE
          sudo apt-get install repo -y
          mkdir android-kernel && cd android-kernel
          repo init --depth=1 --u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-2023-06 --repo-rev=v2.16
          REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common android13-5.15-2023-06)
          DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml
          if grep -q deprecated <<< $REMOTE_BRANCH; then
            echo "Found deprecated branch: android13-5.15-2023-06"
            sed -i 's/"android13-5.15-2023-06"/"deprecated\/android13-5.15-2023-06"/g' $DEFAULT_MANIFEST_PATH
            cat $DEFAULT_MANIFEST_PATH
          fi
          repo --version
          repo --trace sync -c -j$(nproc --all) --no-tags
          df -h

      - name: Setup KernelSU-Next
        run: |
          cd $GITHUB_WORKSPACE/android-kernel
          echo "[+] KernelSU-Next setup"
          GKI_ROOT=$(pwd)
          echo "[+] GKI_ROOT: $GKI_ROOT"
          echo "[+] Copy KernelSU-Next driver to $GKI_ROOT/common/drivers"
          ln -sf $GITHUB_WORKSPACE/KernelSU-Next/kernel $GKI_ROOT/common/drivers/kernelsu
          echo "[+] Add KernelSU-Next driver to Makefile"
          DRIVER_MAKEFILE=$GKI_ROOT/common/drivers/Makefile
          DRIVER_KCONFIG=$GKI_ROOT/common/drivers/Kconfig
          grep -q "kernelsu" "$DRIVER_MAKEFILE" || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> "$DRIVER_MAKEFILE"
          grep -q "kernelsu" "$DRIVER_KCONFIG" || sed -i "/endmenu/i\\source \"drivers/kernelsu/Kconfig\"" "$DRIVER_KCONFIG"
          echo "[+] Apply Compilation Patches"
          # Fix host toolchain: glibc >= 2.38 (Ubuntu 24.04) redirects strtol/strtoul/strtoull
          # to __isoc23_* symbols, which Android 13's clang-14 cannot resolve when linking
          # the resolve_btfids host tool -> "ld.lld: undefined symbol: __isoc23_strtol".
          # Must run unconditionally (android13-5.15 always builds via build/build.sh).
          GLIBC_VERSION=$(ldd --version 2>/dev/null | head -n 1 | awk '{print $NF}')
          echo "GLIBC_VERSION: $GLIBC_VERSION"
          if [ "$(printf '%s\n' "2.38" "$GLIBC_VERSION" | sort -V | head -n1)" = "2.38" ]; then
            echo "Patching resolve_btfids/Makefile"
            cd $GKI_ROOT/common/ && sed -i '/\$(Q)\$(MAKE) -C \$(SUBCMD_SRC) OUTPUT=\$(abspath \$(dir \$@))\/ \$(abspath \$@)/s//$(Q)$(MAKE) -C $(SUBCMD_SRC) EXTRA_CFLAGS="$(CFLAGS)" OUTPUT=$(abspath $(dir $@))\/ $(abspath $@)/' tools/bpf/resolve_btfids/Makefile || echo "No patch needed."
          fi
          repo status
          echo "[+] KernelSU-Next setup done."

      - name: Symbol Magic
        run: |
          echo "[+] Export all symbol from abi_gki_aarch64.xml"
          COMMON_ROOT=$GITHUB_WORKSPACE/android-kernel/common
          KSU_ROOT=$GITHUB_WORKSPACE/KernelSU-Next
          ABI_XML=$COMMON_ROOT/android/abi_gki_aarch64.xml
          SYMBOL_LIST=$COMMON_ROOT/android/abi_gki_aarch64
          echo "[+] Add KernelSU-Next symbols"
          cat $KSU_ROOT/kernel/export_symbol.txt | awk '{sub("[ \t]+","");print "  "$0}' >> $SYMBOL_LIST

      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: gki-kernel-aarch64-android13-5.15-susfs
          max-size: 2G
          save: true

      - name: Setup for Intree
        working-directory: android-kernel
        run: |
          # Intree mode: compile KernelSU into vmlinux. No external kernelsu.ko needed.
          # KSU default: y (built-in). SUS_SU stays n to keep 5.15/KMI8 simple.
          sed -i '/config KSU/,/help/{s/default m/default y/}' common/drivers/kernelsu/Kconfig
          grep -n "config KSU\b" common/drivers/kernelsu/Kconfig
          grep -A4 "^config KSU$" common/drivers/kernelsu/Kconfig || grep -A4 "config KSU[^_]" common/drivers/kernelsu/Kconfig || true
          # Ensure SUS_SU stays disabled (default n) for this 5.15 build
          python3 - <<'EOF'
          import re
          p = 'common/drivers/kernelsu/Kconfig'
          s = open(p, encoding='utf-8').read()
          pat = re.compile(r'(?m)^config KSU_SUSFS_SUS_SU\n(.*?)(?=^config |^if |^endif |^)', re.S)
          m = pat.search(s)
          if m:
              inner = re.sub(r'(?m)^\s*default y\b', '\tdefault n', m.group(1))
              s = s[:m.start(1)] + inner + s[m.end(1):]
              open(p, 'w', encoding='utf-8').write(s)
              print('[+] KSU_SUSFS_SUS_SU set to default n')
          else:
              print('[!] KSU_SUSFS_SUS_SU block not found (check Kconfig)')
          EOF
          grep -n "KSU_SUSFS_SUS_SU" common/drivers/kernelsu/Kconfig

          # Intree: KernelSU is part of vmlinux; keep default ABI/module handling.
          # No gki_aarch64_modules addition needed for a built-in driver.
          # bazel/build.sh needed only for LKM .ko; intree builds Image directly via build.sh

      - name: Integrate SUSFS into Kernel Source
        working-directory: android-kernel/common
        run: |
          set -e
          echo "[+] Downloading SUSFS 6.1 kernel patch (pershoot gki-android14-6.1-dev_122425)"
          curl -L -o /tmp/50_add_susfs.patch https://gitlab.com/pershoot/susfs4ksu/-/raw/gki-android14-6.1-dev_122425/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch
          echo "[+] Applying 50_add_susfs patch (21 hunks rejected on 5.15, ported below)"
          git apply --reject /tmp/50_add_susfs.patch || echo "Partial reject expected, continuing..."
          echo "[+] Rejected hunks before porting:"
          find . -name '*.rej' || true
          echo "[+] Downloading SUSFS new-API source files (dev branch)"
          curl -L -o fs/susfs.c https://gitlab.com/pershoot/susfs4ksu/-/raw/gki-android14-6.1-dev_122425/kernel_patches/fs/susfs.c
          curl -L -o include/linux/susfs.h https://gitlab.com/pershoot/susfs4ksu/-/raw/gki-android14-6.1-dev_122425/kernel_patches/include/linux/susfs.h
          curl -L -o include/linux/susfs_def.h https://gitlab.com/pershoot/susfs4ksu/-/raw/gki-android14-6.1-dev_122425/kernel_patches/include/linux/susfs_def.h
          echo "[+] Porting 6.1 patch to 5.15 / KMI 8"
          cat > /tmp/fix_susfs_515.py <<'PYEOF'
          import io
          import sys

          def write(path, s):
              with io.open(path, 'w', encoding='utf-8', newline='\n') as f:
                  f.write(s)

          def read(path):
              with io.open(path, encoding='utf-8') as f:
                  return f.read()

          def patch_file(path, old, new, tag):
              s = read(path)
              n = s.count(old)
              if n != 1:
                  sys.stderr.write('[FAIL] %s: anchor found %d times (expected 1)\n' % (tag, n))
                  sys.exit(1)
              write(path, s.replace(old, new, 1))
              sys.stdout.write('[OK] %s\n' % tag)

          def apply_in(path, sig, marker, pre, post, tag):
              s = read(path)
              i = s.find(sig)
              if i < 0:
                  sys.stderr.write('[FAIL] %s: signature not found\n' % tag)
                  sys.exit(1)
              j = s.find(marker, i)
              if j < 0:
                  sys.stderr.write('[FAIL] %s: marker not found after signature\n' % tag)
                  sys.exit(1)
              write(path, s[:j] + pre + s[j:j+len(marker)] + post + s[j+len(marker):])
              sys.stdout.write('[OK] %s\n' % tag)

          def append_to(path, text, tag):
              write(path, read(path).rstrip('\n') + '\n' + text)
              sys.stdout.write('[OK] %s\n' % tag)

          # =====================================================================
          # fs/namei.c  (5.15 removed lookup_one_qstr_excl -> port to __lookup_hash)
          # =====================================================================
          # 1a) __lookup_hash: declare found_sus_path
          patch_file(
              'fs/namei.c',
              '\tstruct dentry *dentry = lookup_dcache(name, base, flags);\n'
              '\tstruct dentry *old;\n'
              '\tstruct inode *dir = base->d_inode;\n',
              '\tstruct dentry *dentry = lookup_dcache(name, base, flags);\n'
              '\tstruct dentry *old;\n'
              '\tstruct inode *dir = base->d_inode;\n'
              '#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n'
              '\tbool found_sus_path __maybe_unused = false;\n'
              '#endif\n',
              'namei __lookup_hash decl')

          # 1b) __lookup_hash: retry label + sus inode re-lookup (mirrors 6.1 lookup_one_qstr_excl)
          patch_file(
              'fs/namei.c',
              '\tdentry = d_alloc(base, name);\n'
              '\tif (unlikely(!dentry))\n'
              '\t\treturn ERR_PTR(-ENOMEM);\n'
              '\n'
              '\told = dir->i_op->lookup(dir, dentry, flags);\n'
              '\tif (unlikely(old)) {\n'
              '\t\tdput(dentry);\n'
              '\t\tdentry = old;\n'
              '\t}\n'
              '\treturn dentry;\n'
              '}',
              '\tdentry = d_alloc(base, name);\n'
              '#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n'
              'retry:\n'
              '#endif\n'
              '\tif (unlikely(!dentry))\n'
              '\t\treturn ERR_PTR(-ENOMEM);\n'
              '\n'
              '\told = dir->i_op->lookup(dir, dentry, flags);\n'
              '\tif (unlikely(old)) {\n'
              '\t\tdput(dentry);\n'
              '\t\tdentry = old;\n'
              '\t}\n'
              '#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n'
              '\tif (unlikely(dentry) && !IS_ERR(dentry) && dentry->d_inode && !found_sus_path && susfs_is_inode_sus_path(dentry->d_inode)) {\n'
              '\t\tif (d_in_lookup(dentry))\n'
              '\t\t\td_lookup_done(dentry);\n'
              '\t\tif (!(flags & LOOKUP_RCU))\n'
              '\t\t\tdput(dentry);\n'
              '\t\tdentry = d_alloc(base, &susfs_fake_qstr_name);\n'
              '\t\tfound_sus_path = true;\n'
              '\t\tgoto retry;\n'
              '\t}\n'
              '#endif\n'
              '\treturn dentry;\n'
              '}',
              'namei __lookup_hash retry')

          # 1c) lookup_fast: the 6.1 RCU block referenced nd->next_seq/backup_next_seq
          #     which do not exist here; the RCU lookup uses a local 'seq'.
          #     Also drop the now-unused backup_next_seq local var.
          patch_file(
              'fs/namei.c',
              '\tunsigned int backup_next_seq = nd->next_seq;\n',
              '',
              'namei drop unused backup_next_seq')

          rcu_pre = (
              '#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n'
              '\t\tif (is_nd_state_lookup_last_and_open_last && parent->d_inode) {\n'
              '\t\t\tif (susfs_is_base_dentry_android_data_dir(parent) &&\n'
              '\t\t\t\tsusfs_is_sus_android_data_d_name_found(nd->last.name))\n'
              '\t\t\t{\n'
              '\t\t\t\tdentry = __d_lookup_rcu(parent, &susfs_fake_qstr_name, &seq);\n'
              '\t\t\t\tgoto skip_orig_flow1;\n'
              '\t\t\t} else if (susfs_is_base_dentry_sdcard_dir(parent) &&\n'
              '\t\t\t\t\tsusfs_is_sus_sdcard_d_name_found(nd->last.name))\n'
              '\t\t\t{\n'
              '\t\t\t\tdentry = __d_lookup_rcu(parent, &susfs_fake_qstr_name, &seq);\n'
              '\t\t\t\tgoto skip_orig_flow1;\n'
              '\t\t\t}\n'
              '\t\t}\n'
              '#endif\n')
          rcu_post = (
              '\n'
              '#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n'
              '\t\tif (is_nd_state_lookup_last_and_open_last && dentry && !IS_ERR(dentry) && dentry->d_inode) {\n'
              '\t\t\tif (susfs_is_inode_sus_path(dentry->d_inode)) {\n'
              '\t\t\t\tdentry = __d_lookup_rcu(parent, &susfs_fake_qstr_name, &seq);\n'
              '\t\t\t}\n'
              '\t\t}\n'
              'skip_orig_flow1:\n'
              '#endif\n')
          apply_in('fs/namei.c',
                   'static struct dentry *lookup_fast(struct nameidata *nd,',
                   '\t\tdentry = __d_lookup_rcu(parent, &nd->last, &seq);',
                   rcu_pre, rcu_post, 'namei lookup_fast RCU')

          # 1d) open_last_lookups: 6.1 sets ND_STATE_OPEN_LAST which 5.15 does not.
          patch_file(
              'fs/namei.c',
              '\tconst char *res;\n'
              '\n'
              '\tnd->flags |= op->intent;',
              '\tconst char *res;\n'
              '#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n'
              '\tnd->state |= ND_STATE_OPEN_LAST;\n'
              '#endif\n'
              '\tnd->flags |= op->intent;',
              'namei open_last_lookups ND_STATE_OPEN_LAST')

          # =====================================================================
          # fs/readdir.c  (5.15 fill*d_* return int, 6.1 wrote bool)
          # =====================================================================
          filter_c = (
              '#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n'
              '\t{\n'
              '\t\tstruct inode *inode __maybe_unused;\n'
              '\n'
              '\t\tif (buf->is_base_dentry_android_data_root_dir) {\n'
              '\t\t\tif (susfs_is_sus_android_data_d_name_found(name)) {\n'
              '\t\t\t\treturn 0;\n'
              '\t\t\t}\n'
              '\t\t} else if (buf->is_base_dentry_sdcard_root_dir) {\n'
              '\t\t\tif (susfs_is_sus_sdcard_d_name_found(name)) {\n'
              '\t\t\t\treturn 0;\n'
              '\t\t\t}\n'
              '\t\t}\n'
              '\n'
              '\t\tinode = ilookup(buf->sb, ino);\n'
              '\t\tif (!inode) {\n'
              '\t\t\tgoto filter_done;\n'
              '\t\t}\n'
              '\t\tif (susfs_is_inode_sus_path(inode)) {\n'
              '\t\t\tiput(inode);\n'
              '\t\t\treturn 0;\n'
              '\t\t}\n'
              '\t\tiput(inode);\n'
              'filter_done:\n'
              '\t\t;\n'
              '\t}\n'
              '#endif\n')
          apply_in('fs/readdir.c', 'static int fillonedir(struct dir_context *ctx',
                   '\tbuf->result++;', filter_c, '', 'readdir fillonedir')
          apply_in('fs/readdir.c', 'static int filldir(struct dir_context *ctx',
                   '\tdirent = buf->current_dir;', filter_c, '', 'readdir filldir')
          apply_in('fs/readdir.c', 'static int filldir64(struct dir_context *ctx',
                   '\tdirent = buf->current_dir;', filter_c, '', 'readdir filldir64')
          apply_in('fs/readdir.c', 'static int compat_fillonedir(struct dir_context *ctx',
                   '\tbuf->result++;', filter_c, '', 'readdir compat_fillonedir')
          apply_in('fs/readdir.c', 'static int compat_filldir(struct dir_context *ctx',
                   '\tdirent = buf->current_dir;', filter_c, '', 'readdir compat_filldir')

          # 50_add_susfs 补丁成功应用在 fill* 顶部带入了 `struct inode *inode;`，
          # 但隐藏路径分支并不总是使用它，clang 的 -Werror 会将其判为
          # -Wunused-variable 致命报错。这里用正则统一补上 __maybe_unused 抑制
          # （filter_c 内已带 __maybe_unused 的声明因行尾多出属性字段而不被匹配）。
          import re
          _rd = read('fs/readdir.c')
          _rd = re.sub(r'(?m)^(\t{1,4})struct inode \*inode;$',
                       r'\1struct inode *inode __maybe_unused;', _rd)
          write('fs/readdir.c', _rd)
          sys.stdout.write('[OK] readdir patch-residue inode -> __maybe_unused\n')

          # =====================================================================
          # fs/namespace.c  (6.1 header helpers + tail functions, ported)
          # =====================================================================
          patch_file(
              'fs/namespace.c',
              '#include <linux/mnt_idmapping.h>\n',
              '#include <linux/mnt_idmapping.h>\n'
              '#if defined(CONFIG_KSU_SUSFS_SUS_MOUNT) || defined(CONFIG_KSU_SUSFS_TRY_UMOUNT)\n'
              '#include <linux/susfs_def.h>\n'
              '#endif\n'
              '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
              'extern bool susfs_is_current_ksu_domain(void);\n'
              'extern bool susfs_is_current_zygote_domain(void);\n'
              'extern bool susfs_is_boot_completed_triggered;\n'
              '\n'
              'static DEFINE_IDA(susfs_ksu_mnt_group_ida);\n'
              '\n'
              '#define CL_COPY_MNT_NS BIT(25) /* used by copy_mnt_ns() */\n'
              '#endif\n'
              '#ifdef CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT\n'
              'extern void susfs_auto_add_sus_ksu_default_mount(const char __user *to_pathname);\n'
              'bool susfs_is_auto_add_sus_ksu_default_mount_enabled = true;\n'
              '#endif\n'
              '#ifdef CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT\n'
              'extern void susfs_auto_add_sus_bind_mount(const char *pathname, struct path *path_target);\n'
              'bool susfs_is_auto_add_sus_bind_mount_enabled = true;\n'
              '#endif\n'
              '#ifdef CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT\n'
              'extern void susfs_auto_add_try_umount_for_bind_mount(struct path *path);\n'
              'bool susfs_is_auto_add_try_umount_for_bind_mount_enabled = true;\n'
              '#endif\n',
              'namespace header')

          ns_tail = (
              '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n'
              'void susfs_reorder_mnt_id(void) {\n'
              '\tstruct mnt_namespace *mnt_ns = current->nsproxy->mnt_ns;\n'
              '\tstruct mount *mnt;\n'
              '\tint first_mnt_id = 0;\n'
              '\n'
              '\tif (!mnt_ns) {\n'
              '\t\treturn;\n'
              '\t}\n'
              '\n'
              '\tget_mnt_ns(mnt_ns);\n'
              '\tfirst_mnt_id = list_first_entry(&mnt_ns->list, struct mount, mnt_list)->mnt_id;\n'
              '\tlist_for_each_entry(mnt, &mnt_ns->list, mnt_list) {\n'
              '\t\tif (mnt->mnt_id == DEFAULT_KSU_MNT_ID) {\n'
              '\t\t\tcontinue;\n'
              '\t\t}\n'
              '\t\tWRITE_ONCE(mnt->mnt.susfs_mnt_id_backup, READ_ONCE(mnt->mnt_id));\n'
              '\t\tWRITE_ONCE(mnt->mnt_id, first_mnt_id++);\n'
              '\t}\n'
              '\tput_mnt_ns(mnt_ns);\n'
              '}\n'
              'EXPORT_SYMBOL(susfs_reorder_mnt_id);\n'
              '#endif\n'
              '#ifdef CONFIG_KSU_SUSFS\n'
              'bool susfs_is_mnt_devname_ksu(struct path *path) {\n'
              '\tstruct mount *mnt;\n'
              '\n'
              '\tif (path && path->mnt) {\n'
              '\t\tmnt = real_mount(path->mnt);\n'
              '\t\tif (mnt && mnt->mnt_devname && !strcmp(mnt->mnt_devname, "KSU")) {\n'
              '\t\t\treturn true;\n'
              '\t\t}\n'
              '\t}\n'
              '\treturn false;\n'
              '}\n'
              'EXPORT_SYMBOL(susfs_is_mnt_devname_ksu);\n'
              '#endif\n'
              '#ifdef CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT\n'
              'EXPORT_SYMBOL(susfs_is_auto_add_sus_ksu_default_mount_enabled);\n'
              '#endif\n'
              '#ifdef CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT\n'
              'EXPORT_SYMBOL(susfs_is_auto_add_sus_bind_mount_enabled);\n'
              '#endif\n'
              '#ifdef CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT\n'
              'EXPORT_SYMBOL(susfs_is_auto_add_try_umount_for_bind_mount_enabled);\n'
              '#endif\n')
          append_to('fs/namespace.c', ns_tail, 'namespace tail + exports')

          # =====================================================================
          # fs/proc/task_mmu.c  (SUS_MAP leak hiding for /proc/self/smaps)
          # =====================================================================
          patch_file(
              'fs/proc/task_mmu.c',
              '#include <linux/pkeys.h>\n',
              '#include <linux/pkeys.h>\n'
              '#if defined(CONFIG_KSU_SUSFS_SUS_KSTAT) || defined(CONFIG_KSU_SUSFS_SUS_MAP)\n'
              '#include <linux/susfs_def.h>\n'
              '#endif\n',
              'task_mmu include')

          smap_pre = (
              '#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n'
              '\tif (vma->vm_file &&\n'
              '\t\tunlikely(file_inode(vma->vm_file)->i_mapping->flags & BIT_SUS_MAPS) &&\n'
              '\t\tsusfs_is_current_proc_umounted())\n'
              '\t{\n'
              '\t\tshow_map_vma(m, vma);\n'
              '\t\tSEQ_PUT_DEC("Size:           ", vma->vm_end - vma->vm_start);\n'
              '\t\tSEQ_PUT_DEC(" kB\\nKernelPageSize: ", vma_kernel_pagesize(vma));\n'
              '\t\tSEQ_PUT_DEC(" kB\\nMMUPageSize:    ", vma_mmu_pagesize(vma));\n'
              '\t\tseq_puts(m, " kB\\n");\n'
              '\t\t__show_smap(m, &mss, false);\n'
              '\t\tseq_printf(m, "THPeligible:    %d\\n", 0);\n'
              '\t\tif (arch_pkeys_enabled())\n'
              '\t\t\tseq_printf(m, "ProtectionKey:  %8u\\n", vma_pkey(vma));\n'
              '\t\tseq_puts(m, "VmFlags: mr mw me");\n'
              '\t\tseq_putc(m, \'\\n\');\n'
              '\t\treturn 0;\n'
              '\t}\n'
              '#endif\n')
          apply_in('fs/proc/task_mmu.c', 'static int show_smap(struct seq_file *m, void *v)',
                   '\tsmap_gather_stats(vma, &mss, 0);', smap_pre, '', 'task_mmu show_smap')

          roll_pre = (
              '#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n'
              '\t\tif (vma->vm_file &&\n'
              '\t\t\tunlikely(file_inode(vma->vm_file)->i_mapping->flags & BIT_SUS_MAPS) &&\n'
              '\t\t\tsusfs_is_current_proc_umounted())\n'
              '\t\t{\n'
              '\t\t\tmemset(&mss, 0, sizeof(mss));\n'
              '\t\t\tgoto bypass_orig_flow;\n'
              '\t\t}\n'
              '#endif\n')
          roll_post = (
              '\n'
              '#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n'
              'bypass_orig_flow:\n'
              '#endif\n')
          apply_in('fs/proc/task_mmu.c', 'static int show_smaps_rollup(struct seq_file *m, void *v)',
                   '\t\tsmap_gather_stats(vma, &mss, 0);', roll_pre, roll_post, 'task_mmu show_smaps_rollup')

          # =====================================================================
          # fs/proc/base.c  (SUS_MAP leak hiding for /proc/pid/map_files)
          # =====================================================================
          patch_file(
              'fs/proc/base.c',
              '#include <linux/cpufreq_times.h>\n',
              '#include <linux/cpufreq_times.h>\n'
              '#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n'
              '#include <linux/susfs_def.h>\n'
              '#endif\n',
              'base.c include')

          map_skip = (
              '#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n'
              '\t\tif (unlikely(file_inode(vma->vm_file)->i_mapping->flags & BIT_SUS_MAPS) &&\n'
              '\t\t\tsusfs_is_current_proc_umounted())\n'
              '\t\t{\n'
              '\t\t\tcontinue;\n'
              '\t\t}\n'
              '#endif\n')
          apply_in('fs/proc/base.c',
                   'proc_map_files_readdir(struct file *file, struct dir_context *ctx)',
                   '\t\tif (!vma->vm_file)\n'
                   '\t\t\tcontinue;\n',
                   '', map_skip, 'base.c proc_map_files_readdir skip')

          # =====================================================================
          # fs/notify/fdinfo.c  -- 6.1 introduced a 3-arg inotify_fdinfo that requires
          # the 3-arg show_fdinfo callback signature; the whole signature hunk was
          # rejected on 5.15. Revert inotify_fdinfo to the 2-arg original so fdinfo.c
          # stays self-consistent (SUS_MOUNT fdinfo leakage hiding is skipped on 5.15).
          # =====================================================================
          fdinfo_orig = (
              'static void inotify_fdinfo(struct seq_file *m, struct fsnotify_mark *mark)\n'
              '{\n'
              '\tstruct inotify_inode_mark *inode_mark;\n'
              '\tstruct inode *inode;\n'
              '\n'
              '\tif (mark->connector->type != FSNOTIFY_OBJ_TYPE_INODE)\n'
              '\t\treturn;\n'
              '\n'
              '\tinode_mark = container_of(mark, struct inotify_inode_mark, fsn_mark);\n'
              '\tinode = igrab(fsnotify_conn_inode(mark->connector));\n'
              '\tif (inode) {\n'
              '\t\tseq_printf(m, "inotify wd:%x ino:%lx sdev:%x mask:%x ignored_mask:0 ",\n'
              '\t\t\t   inode_mark->wd, inode->i_ino, inode->i_sb->s_dev,\n'
              '\t\t\t   inotify_mark_user_mask(mark));\n'
              '\t\tshow_mark_fhandle(m, inode);\n'
              '\t\tseq_putc(m, \'\\n\');\n'
              '\t\tiput(inode);\n'
              '\t}\n'
              '}\n')
          fdinfo_src = read('fs/notify/fdinfo.c')
          fstart = fdinfo_src.find('#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\nstatic void inotify_fdinfo')
          if fstart < 0:
              sys.stderr.write('[FAIL] fdinfo: 3-arg inotify_fdinfo block not found\n')
              sys.exit(1)
          fend = fdinfo_src.find('void inotify_show_fdinfo', fstart)
          if fend < 0:
              sys.stderr.write('[FAIL] fdinfo: inotify_show_fdinfo not found\n')
              sys.exit(1)
          fdinfo_src = fdinfo_src[:fstart] + fdinfo_orig + fdinfo_src[fend:]
          write('fs/notify/fdinfo.c', fdinfo_src)
          sys.stdout.write('[OK] fdinfo revert inotify_fdinfo to 2-arg\n')

          # =====================================================================
          # fs/susfs.c  --  new API builds susfs.o into vmlinux; export all symbols
          # the kernelsu.ko (drivers/kernelsu) module links against.
          # =====================================================================
          exports = (
              '#include <linux/export.h>\n'
              'EXPORT_SYMBOL(susfs_starts_with);\n'
              'EXPORT_SYMBOL(susfs_set_i_state_on_external_dir);\n'
              'EXPORT_SYMBOL(susfs_add_sus_path);\n'
              'EXPORT_SYMBOL(susfs_add_sus_path_loop);\n'
              'EXPORT_SYMBOL(susfs_run_sus_path_loop);\n'
              'EXPORT_SYMBOL(susfs_is_base_dentry_android_data_dir);\n'
              'EXPORT_SYMBOL(susfs_is_base_dentry_sdcard_dir);\n'
              'EXPORT_SYMBOL(susfs_is_sus_android_data_d_name_found);\n'
              'EXPORT_SYMBOL(susfs_is_sus_sdcard_d_name_found);\n'
              'EXPORT_SYMBOL(susfs_is_inode_sus_path);\n'
              'EXPORT_SYMBOL(susfs_add_sus_mount);\n'
              'EXPORT_SYMBOL(susfs_auto_add_sus_bind_mount);\n'
              'EXPORT_SYMBOL(susfs_auto_add_sus_ksu_default_mount);\n'
              'EXPORT_SYMBOL(susfs_add_sus_kstat);\n'
              'EXPORT_SYMBOL(susfs_update_sus_kstat);\n'
              'EXPORT_SYMBOL(susfs_sus_ino_for_generic_fillattr);\n'
              'EXPORT_SYMBOL(susfs_sus_ino_for_show_map_vma);\n'
              'EXPORT_SYMBOL(susfs_add_try_umount);\n'
              'EXPORT_SYMBOL(susfs_try_umount);\n'
              'EXPORT_SYMBOL(susfs_auto_add_try_umount_for_bind_mount);\n'
              'EXPORT_SYMBOL(susfs_set_uname);\n'
              'EXPORT_SYMBOL(susfs_spoof_uname);\n'
              'EXPORT_SYMBOL(susfs_set_log);\n'
              'EXPORT_SYMBOL(susfs_set_cmdline_or_bootconfig);\n'
              'EXPORT_SYMBOL(susfs_spoof_cmdline_or_bootconfig);\n'
              'EXPORT_SYMBOL(susfs_add_open_redirect);\n'
              'EXPORT_SYMBOL(susfs_get_redirected_path);\n'
              'EXPORT_SYMBOL(susfs_get_sus_su_working_mode);\n'
              'EXPORT_SYMBOL(susfs_add_sus_map);\n'
              'EXPORT_SYMBOL(susfs_get_enabled_features);\n'
              'EXPORT_SYMBOL(susfs_set_avc_log_spoofing);\n'
              'EXPORT_SYMBOL(susfs_is_log_enabled);\n')
          append_to('fs/susfs.c', exports, 'susfs.c exports')

          sys.stdout.write('All 5.15 ports applied.\n')
          PYEOF
          python3 /tmp/fix_susfs_515.py
          echo "[+] Removing .rej leftovers"
          find . -name '*.rej' -delete
          echo "[+] Verifying SUSFS integration"
          test -f fs/susfs.c && test -f include/linux/susfs.h && test -f include/linux/susfs_def.h
          grep -n "susfs.o" fs/Makefile
          echo "[+] SUSFS integration done."

      - name: Make Working Directory Clean to Avoid Dirty
        working-directory: android-kernel
        run: |
          if [ -f ./common/BUILD.bazel ]; then
            sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' ./common/BUILD.bazel
          fi
          rm common/android/abi_gki_protected_exports_* || echo "No protected exports!"
          git config --global user.email "bot@kernelsu.org"
          git config --global user.name "KernelSU-NextBot"
          cd common/ && git add -A && git commit -a -m "Add KernelSU-Next + SUSFS" || echo "Nothing to commit"
          repo status

      - name: Build Kernel/LKM
        working-directory: android-kernel
        run: |
          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh CC="/usr/bin/ccache clang"

      - name: Prepare Artifacts
        run: |
          OUTDIR=android-kernel/out/android13-5.15/dist
          if [ ! -e $OUTDIR ]; then
            OUTDIR=android-kernel/dist
          fi
          mkdir -p output
          echo "[+] Build outputs:"
          ls -lh $OUTDIR | head -n 40
          cp $OUTDIR/Image ./output/Image-susfs-intree-android13-5.15
          echo "[+] Final artifacts:"
          ls -lh ./output/

      - name: Upload SUSFS Kernel Image (Intree)
        uses: actions/upload-artifact@v4
        with:
          name: Image-android13-5.15-susfs-intree
          path: ./output/Image-susfs-intree-android13-5.15