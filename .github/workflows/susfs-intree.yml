name: SUSFS Intree Build (android13-5.15 / KMI 8)

# 一键编译带 SUSFS + KernelSU(intree) 的内核镜像 Image
# KernelSU 直接编进内核(vmlinux)，不依赖外部 kernelsu.ko 加载
# 适用设备：Redmi 23078RKD5C (corot) / 内核 5.15-android13-8 (KMI 8)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build kernelsu + SUSFS (android13-5.15-2023-06)
    # Ubuntu 24.04 (glibc 2.38+) redirects strtol/strtoul/strtoull to __isoc23_*,
    # breaking resolve_btfids link with Android 13 clang-14. Pin to 22.04 (glibc 2.35).
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Checkout KernelSU-Next (dev-susfs, newest KSU >=33188)
        uses: actions/checkout@v4
        with:
          repository: pershoot/KernelSU-Next
          ref: dev-susfs
          path: KernelSU-Next
          fetch-depth: 0

      - name: Point origin/HEAD at dev-susfs (fix KERNEL_SU_VERSION)
        run: |
          # KernelSU-Next/kernel computes KERNEL_SU_VERSION from git describe.
          # With a detached checkout origin/HEAD is missing, so the tags/hash fallback
          # prints "fatal: ambiguous argument 'origin/HEAD'" and leaves the version
          # wrong. Pin HEAD so git describe resolves a high version (>=33188).
          git -C $GITHUB_WORKSPACE/KernelSU-Next checkout dev-susfs
          git -C $GITHUB_WORKSPACE/KernelSU-Next remote set-head origin dev-susfs
          git -C $GITHUB_WORKSPACE/KernelSU-Next describe --tags --abbrev=0 || true
          git -C $GITHUB_WORKSPACE/KernelSU-Next log --oneline -1
          # New-arch dev-susfs has no kernel/export_symbol.txt; keep it tolerant.
          find $GITHUB_WORKSPACE/KernelSU-Next -iname '*symbol*' -o -iname '*symbol*' 2>/dev/null | head

      - name: Setup Kernel Source (KMI 8 tag)
        run: |
          echo "Free space:"
          df -h
          cd $GITHUB_WORKSPACE
          sudo apt-get install repo -y
          mkdir android-kernel && cd android-kernel
          repo init --depth=1 --u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-2023-06 --repo-rev=v2.16
          REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common android13-5.15-2023-06)
          DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml
          if grep -q deprecated <<< $REMOTE_BRANCH; then
            echo "Found deprecated branch: android13-5.15-2023-06"
            sed -i 's/"android13-5.15-2023-06"/"deprecated\/android13-5.15-2023-06"/g' $DEFAULT_MANIFEST_PATH
            cat $DEFAULT_MANIFEST_PATH
          fi
          repo --version
          repo --trace sync -c -j$(nproc --all) --no-tags
          df -h

      - name: Setup KernelSU-Next
        run: |
          cd $GITHUB_WORKSPACE/android-kernel
          echo "[+] KernelSU-Next setup"
          GKI_ROOT=$(pwd)
          echo "[+] GKI_ROOT: $GKI_ROOT"
          echo "[+] Copy KernelSU-Next driver to $GKI_ROOT/common/drivers"
          ln -sf $GITHUB_WORKSPACE/KernelSU-Next/kernel $GKI_ROOT/common/drivers/kernelsu
          echo "[+] Add KernelSU-Next driver to Makefile"
          DRIVER_MAKEFILE=$GKI_ROOT/common/drivers/Makefile
          DRIVER_KCONFIG=$GKI_ROOT/common/drivers/Kconfig
          grep -q "kernelsu" "$DRIVER_MAKEFILE" || printf "\nobj-\$(CONFIG_KSU) += kernelsu/\n" >> "$DRIVER_MAKEFILE"
          grep -q "kernelsu" "$DRIVER_KCONFIG" || sed -i "/endmenu/i\\source \"drivers/kernelsu/Kconfig\"" "$DRIVER_KCONFIG"
          echo "[+] Apply Compilation Patches"
          # Fix host toolchain: glibc >= 2.38 (Ubuntu 24.04) redirects strtol/strtoul/strtoull
          # to __isoc23_* symbols, which Android 13's clang-14 cannot resolve when linking
          # the resolve_btfids host tool -> "ld.lld: undefined symbol: __isoc23_strtol".
          # Must run unconditionally (android13-5.15 always builds via build/build.sh).
          GLIBC_VERSION=$(ldd --version 2>/dev/null | head -n 1 | awk '{print $NF}')
          echo "GLIBC_VERSION: $GLIBC_VERSION"
          if [ "$(printf '%s\n' "2.38" "$GLIBC_VERSION" | sort -V | head -n1)" = "2.38" ]; then
            echo "Patching resolve_btfids/Makefile"
            cd $GKI_ROOT/common/ && sed -i '/\$(Q)\$(MAKE) -C \$(SUBCMD_SRC) OUTPUT=\$(abspath \$(dir \$@))\/ \$(abspath \$@)/s//$(Q)$(MAKE) -C $(SUBCMD_SRC) EXTRA_CFLAGS="$(CFLAGS)" OUTPUT=$(abspath $(dir $@))\/ $(abspath $@)/' tools/bpf/resolve_btfids/Makefile || echo "No patch needed."
          fi
          repo status
          echo "[+] KernelSU-Next setup done."

      - name: Symbol Magic
        run: |
          echo "[+] Export all symbol from abi_gki_aarch64.xml"
          COMMON_ROOT=$GITHUB_WORKSPACE/android-kernel/common
          KSU_ROOT=$GITHUB_WORKSPACE/KernelSU-Next
          ABI_XML=$COMMON_ROOT/android/abi_gki_aarch64.xml
          SYMBOL_LIST=$COMMON_ROOT/android/abi_gki_aarch64
          echo "[+] Add KernelSU-Next symbols (tolerant: dev-susfs has no export_symbol.txt)"
          if [ -f "$KSU_ROOT/kernel/export_symbol.txt" ]; then
            cat $KSU_ROOT/kernel/export_symbol.txt | awk '{sub("[ \t]+","");print "  "$0}' >> $SYMBOL_LIST
          else
            echo "[!] kernel/export_symbol.txt missing in dev-susfs; intree needs no abi symbol-export list."
          fi

      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: gki-kernel-aarch64-android13-5.15-susfs
          max-size: 2G
          save: true

      - name: Setup for Intree
        working-directory: android-kernel
        run: |
          # Intree mode: compile KernelSU into vmlinux. No external kernelsu.ko needed.
          # KSU default: y (built-in). SUS_SU stays n to keep 5.15/KMI8 simple.
          sed -i '/config KSU/,/help/{s/default m/default y/}' common/drivers/kernelsu/Kconfig
          grep -n "config KSU\b" common/drivers/kernelsu/Kconfig
          grep -A4 "^config KSU$" common/drivers/kernelsu/Kconfig || grep -A4 "config KSU[^_]" common/drivers/kernelsu/Kconfig || true
          # Ensure SUS_SU stays disabled (default n) for this 5.15 build
          python3 - <<'EOF'
          import re
          p = 'common/drivers/kernelsu/Kconfig'
          s = open(p, encoding='utf-8').read()
          pat = re.compile(r'(?m)^config KSU_SUSFS_SUS_SU\n(.*?)(?=^config |^if |^endif |^)', re.S)
          m = pat.search(s)
          if m:
              inner = re.sub(r'(?m)^\s*default y\b', '\tdefault n', m.group(1))
              s = s[:m.start(1)] + inner + s[m.end(1):]
              open(p, 'w', encoding='utf-8').write(s)
              print('[+] KSU_SUSFS_SUS_SU set to default n')
          else:
              print('[!] KSU_SUSFS_SUS_SU block not found (check Kconfig)')
          EOF
          # dev-susfs (new arch) has no KSU_SUSFS_SUS_SU config; list the whole KSU_SUSFS
          # family instead. Do not fail when the symbol is absent.
          grep -n "KSU_SUSFS" common/drivers/kernelsu/Kconfig || true

          # Intree: KernelSU is part of vmlinux; keep default ABI/module handling.
          # No gki_aarch64_modules addition needed for a built-in driver.
          # bazel/build.sh needed only for LKM .ko; intree builds Image directly via build.sh

      - name: Integrate SUSFS into Kernel Source
        working-directory: android-kernel/common
        run: |
          set -e
          echo "[+] Downloading SUSFS sources (simonpunk gki-android13-5.15-dev, SUSFS v2.3.0)"
          curl -L -o /tmp/50_add_susfs.patch https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android13-5.15-dev/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch
          curl -L -o fs/susfs.c https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android13-5.15-dev/kernel_patches/fs/susfs.c
          curl -L -o include/linux/susfs.h https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android13-5.15-dev/kernel_patches/include/linux/susfs.h
          curl -L -o include/linux/susfs_def.h https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android13-5.15-dev/kernel_patches/include/linux/susfs_def.h
          echo "[+] Verifying new-API def.h (TIF_PROC_NO_SU / zygote_next required by KSU-Next dev-susfs)"
          grep -q "TIF_PROC_NO_SU" include/linux/susfs_def.h \
            && grep -q "susfs_set_current_proc_umounted_for_zygote_next" include/linux/susfs_def.h \
            || { echo "FATAL: susfs_def.h missing new-API symbols"; exit 1; }
          echo "[+] Applying 50_add_susfs patch (3 hunks expected to reject on 5.15.78, ported below)"
          git apply --reject /tmp/50_add_susfs.patch || echo "Partial reject expected, continuing..."
          echo "[+] Rejected hunks before porting:"
          find . -name '*.rej' || true
          cat > /tmp/fix_susfs_kmi8.py <<'PYEOF'
          import io
          import sys

          def patch_file(path, old, new, tag):
              with io.open(path, encoding='utf-8') as f:
                  s = f.read()
              n = s.count(old)
              if n != 1:
                  sys.stderr.write("[FAIL] %s: anchor found %d times (expected 1)\n" % (tag, n))
                  sys.exit(1)
              s = s.replace(old, new)
              with io.open(path, 'w', encoding='utf-8', newline='\n') as f:
                  f.write(s)
              sys.stdout.write("[OK] %s\n" % tag)

          # 1) kernel/sys.c: 补丁 hunk 上下文含 "bool ruid_new, euid_new, suid_new;"
          #    (5.15.78 无此行被拒)，改为锚定 kuid_t 声明插入 ksu_handle_setresuid 调用
          patch_file(
              'kernel/sys.c',
              "\tkuid_t kruid, keuid, ksuid;\n\n\tkruid = make_kuid(ns, ruid);",
              "\tkuid_t kruid, keuid, ksuid;\n\n"
              "#ifdef CONFIG_KSU_SUSFS\n"
              "\t(void)ksu_handle_setresuid(ruid, euid, suid);\n"
              "#endif\n\n"
              "\tkruid = make_kuid(ns, ruid);",
              'kernel/sys.c (ksu_handle_setresuid)')

          # 2) fs/proc/task_mmu.c: show_smap 补丁 hunk 上下文含 "if (!vma_pages(vma))"
          #    (5.15.78 无此行被拒)，改为锚定函数开头插入 SUS_MAP 隐藏检查
          patch_file(
              'fs/proc/task_mmu.c',
              "static int show_smap(struct seq_file *m, void *v)\n"
              "{\n"
              "\tstruct vm_area_struct *vma = v;\n"
              "\tstruct mem_size_stats mss;\n\n"
              "\tmemset(&mss, 0, sizeof(mss));",
              "static int show_smap(struct seq_file *m, void *v)\n"
              "{\n"
              "\tstruct vm_area_struct *vma = v;\n"
              "\tstruct mem_size_stats mss;\n\n"
              "#ifdef CONFIG_KSU_SUSFS_SUS_MAP\n"
              "\tif (vma->vm_file) {\n"
              "\t\tif (SUSFS_IS_INODE_SUS_MAP(file_inode(vma->vm_file)))\n"
              "\t\t\treturn 0;\n"
              "\t}\n"
              "#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MAP\n\n"
              "\tmemset(&mss, 0, sizeof(mss));",
              'fs/proc/task_mmu.c (show_smap SUS_MAP)')

          # 3) fs/namei.c: lookup_one_qstr_excl 尾块 hunk (5.15.78 无该函数，
          #    对应 __lookup_hash)。前两个 hunk (found_sus_path 声明/retry 标签)
          #    已按上下文自动落到 __lookup_hash，此处补上被拒的 SUS_PATH 尾块。
          patch_file(
              'fs/namei.c',
              "\tdentry = d_alloc(base, name);\n"
              "#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
              "retry:\n"
              "#endif\n"
              "\tif (unlikely(!dentry))\n"
              "\t\treturn ERR_PTR(-ENOMEM);\n\n"
              "\told = dir->i_op->lookup(dir, dentry, flags);\n"
              "\tif (unlikely(old)) {\n"
              "\t\tdput(dentry);\n"
              "\t\tdentry = old;\n"
              "\t}\n"
              "\treturn dentry;\n"
              "}",
              "\tdentry = d_alloc(base, name);\n"
              "#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
              "retry:\n"
              "#endif\n"
              "\tif (unlikely(!dentry))\n"
              "\t\treturn ERR_PTR(-ENOMEM);\n\n"
              "\told = dir->i_op->lookup(dir, dentry, flags);\n"
              "\tif (unlikely(old)) {\n"
              "\t\tdput(dentry);\n"
              "\t\tdentry = old;\n"
              "\t}\n"
              "#ifdef CONFIG_KSU_SUSFS_SUS_PATH\n"
              "\tif (unlikely(dentry) && !IS_ERR(dentry) && dentry->d_inode && !found_sus_path && susfs_is_inode_sus_path(dentry->d_inode)) {\n"
              "\t\tif (d_in_lookup(dentry))\n"
              "\t\t\td_lookup_done(dentry);\n"
              "\t\tif (!(flags & LOOKUP_RCU))\n"
              "\t\t\tdput(dentry);\n"
              "\t\tdentry = d_alloc(base, &susfs_fake_qstr_name);\n"
              "\t\tfound_sus_path = true;\n"
              "\t\tgoto retry;\n"
              "\t}\n"
              "#endif\n"
              "\treturn dentry;\n"
              "}",
              'fs/namei.c (__lookup_hash SUS_PATH tail)')

          sys.stdout.write("All KMI8 hunk fixes applied.\n")
          PYEOF
          python3 /tmp/fix_susfs_kmi8.py
          echo "[+] Adding VMA_PAD_START compat macro (referenced by task_mmu show_map_vma OPEN_REDIRECT branch; no upstream definition on 5.15)"
          cat >> include/linux/susfs_def.h <<'EOF'

          #ifndef VMA_PAD_START
          #define VMA_PAD_START(vma) (vma)->vm_start
          #endif
          EOF
          echo "[+] Exporting susfs symbols for KernelSU-Next supercalls (5.15-dev API names)"
          cat >> fs/susfs.c <<'EOF'

          #include <linux/export.h>
          EXPORT_SYMBOL(susfs_add_sus_path);
          EXPORT_SYMBOL(susfs_add_sus_path_loop);
          EXPORT_SYMBOL(susfs_is_inode_sus_path);
          EXPORT_SYMBOL(susfs_set_hide_sus_mnts_for_non_su_procs);
          EXPORT_SYMBOL(susfs_add_sus_kstat);
          EXPORT_SYMBOL(susfs_update_sus_kstat);
          EXPORT_SYMBOL(susfs_sus_kstat_spoof_generic_fillattr);
          EXPORT_SYMBOL(susfs_sus_kstat_spoof_show_map_vma);
          EXPORT_SYMBOL(susfs_set_uname);
          EXPORT_SYMBOL(susfs_spoof_uname);
          EXPORT_SYMBOL(susfs_enable_log);
          EXPORT_SYMBOL(susfs_set_cmdline_or_bootconfig);
          EXPORT_SYMBOL(susfs_spoof_cmdline_or_bootconfig);
          EXPORT_SYMBOL(susfs_add_open_redirect);
          EXPORT_SYMBOL(susfs_add_sus_map);
          EXPORT_SYMBOL(susfs_set_avc_log_spoofing);
          EXPORT_SYMBOL(susfs_get_enabled_features);
          EXPORT_SYMBOL(susfs_show_variant);
          EXPORT_SYMBOL(susfs_show_version);
          EXPORT_SYMBOL(susfs_start_sdcard_monitor_fn);
          EXPORT_SYMBOL(susfs_init);
          EOF
          echo "[+] Removing .rej leftovers"
          find . -name '*.rej' -delete
          echo "[+] Verifying SUSFS integration"
          test -f fs/susfs.c && test -f include/linux/susfs.h && test -f include/linux/susfs_def.h
          grep -n "susfs.o" fs/Makefile
          grep -q "susfs_is_inode_sus_path" fs/namei.c
          grep -q "SUSFS_IS_INODE_SUS_MAP" fs/proc/task_mmu.c
          grep -q "ksu_handle_setresuid" kernel/sys.c
          grep -q "VMA_PAD_START" include/linux/susfs_def.h
          echo "[+] SUSFS integration done."

      - name: Make Working Directory Clean to Avoid Dirty
        working-directory: android-kernel
        run: |
          if [ -f ./common/BUILD.bazel ]; then
            sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' ./common/BUILD.bazel
          fi
          rm common/android/abi_gki_protected_exports_* || echo "No protected exports!"
          git config --global user.email "bot@kernelsu.org"
          git config --global user.name "KernelSU-NextBot"
          cd common/ && git add -A && git commit -a -m "Add KernelSU-Next + SUSFS" || echo "Nothing to commit"
          repo status

      - name: Build Kernel/LKM
        working-directory: android-kernel
        run: |
          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh CC="/usr/bin/ccache clang"

      - name: Prepare Artifacts
        run: |
          OUTDIR=android-kernel/out/android13-5.15/dist
          if [ ! -e $OUTDIR ]; then
            OUTDIR=android-kernel/dist
          fi
          mkdir -p output
          echo "[+] Build outputs:"
          ls -lh $OUTDIR | head -n 40
          cp $OUTDIR/Image ./output/Image-susfs-intree-android13-5.15
          echo "[+] Final artifacts:"
          ls -lh ./output/

      - name: Package AnyKernel3 Flashable Zip
        run: |
          echo "[+] Cloning AnyKernel3"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          rm -rf AnyKernel3/.git* AnyKernel3/.github AnyKernel3/README.md
          cp ./output/Image-susfs-intree-android13-5.15 AnyKernel3/Image
          cd AnyKernel3
          # K60U (corot): android13-5.15 GKI, dtb 不替换（boot.img 自带 dtb 保持原样）
          sed -i \
            -e 's/^kernel.string=.*/kernel.string=KernelSU-Next + SUSFS (android13-5.15-2023-06 KMI8)/' \
            -e 's/^do.devicecheck=.*/do.devicecheck=1/' \
            -e 's/^device.names=.*/device.names=corot,22081212UG,22081212C,Redmi K60 Ultra,Xiaomi 13T Pro/' \
            -e 's/^is_slot_device=.*/is_slot_device=1/' \
            -e 's/^block.auto=.*/block.auto=1/' \
            -e 's/^do.modules=.*/do.modules=0/' \
            -e 's/^do.cleanup=.*/do.cleanup=0/' \
            anykernel.sh
          echo "[+] anykernel.sh key settings:"
          grep -E '^(kernel.string|do.devicecheck|device.names|is_slot_device|block.auto|do.modules)=' anykernel.sh
          zip -r9 ../KernelSU-Next-SUSFS-anykernel3-corot.zip . -x .git*
          cd ..
          echo "[+] Final artifacts:"
          ls -lh ./output/ ./KernelSU-Next-SUSFS-anykernel3-corot.zip

      - name: Upload SUSFS Kernel Image (Intree)
        uses: actions/upload-artifact@v4
        with:
          name: Image-android13-5.15-susfs-intree
          path: ./output/Image-susfs-intree-android13-5.15

      - name: Upload AnyKernel3 Flashable Zip
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-corot-android13-5.15-susfs-intree
          path: ./KernelSU-Next-SUSFS-anykernel3-corot.zip